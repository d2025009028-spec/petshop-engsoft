<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PawControl{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #2E75B6 !important; }
        .navbar-brand { font-weight: bold; font-size: 1.4rem; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #2E75B6; border-color: #2E75B6; }
        .btn-primary:hover { background-color: #245a8d; border-color: #245a8d; }
        .table th { background-color: #2E75B6; color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">🐾 PawControl</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="{% url 'cliente_listar' %}">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'funcionario_listar' %}">Funcionários</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'pet_listar' %}">Pets</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'servico_listar' %}">Serviços</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'agendamento_listar' %}">Agendamentos</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'produto_listar' %}">Produtos</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Relatórios</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="{% url 'relatorio_servicos' %}">Serviços por Período</a></li>
                            <li><a class="dropdown-item" href="{% url 'relatorio_faturamento' %}">Faturamento Mensal</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% if messages %}{% for message in messages %}<div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% endif %}
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
